
name: ZONI AI Android APK Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zoni-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Test and Build ZONI AI
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout original project
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 3. Install frontend dependencies
      - name: Install Frontend Dependencies
        run: npm ci

      # 4. Frontend tests
      - name: Run Frontend Unit Tests
        run: npm test

      # 5. TypeScript and lint checks
      - name: Run Frontend Lint
        run: npm run lint

      # 6. Build dashboard and sync Android assets
      - name: Build Dashboard and Sync Android Assets
        env:
          VITE_BACKEND_URL: ${{ vars.ZONI_BACKEND_URL || 'https://zoni-ai-675435111499.asia-southeast1.run.app' }}
        run: npm run android:sync

      # 7. Setup Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 8. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 9. Install required Android SDK packages
      - name: Install Android SDK Packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 10. Setup Gradle cache
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 11. Verify Java, Android SDK and Gradle
      - name: Verify Build Environment
        run: |
          chmod +x android/gradlew
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          sdkmanager --version
          ./android/gradlew -p android --version

      # 12. Verify Android configuration
      - name: Verify Android Configuration
        run: |
          test -f android/gradle.properties
          grep -q "android.useAndroidX=true" android/gradle.properties

      # 13. Run Android Unit Tests
      - name: Run Android Unit Tests
        env:
          ZONI_BACKEND_URL: ${{ vars.ZONI_BACKEND_URL || 'https://zoni-ai-675435111499.asia-southeast1.run.app' }}
        run: |
          ./android/gradlew \
            -p android \
            --no-daemon \
            :app:testDebugUnitTest \
            --stacktrace

      # 14. Build Debug APK
      - name: Build Debug APK
        env:
          ZONI_BACKEND_URL: ${{ vars.ZONI_BACKEND_URL || 'https://zoni-ai-675435111499.asia-southeast1.run.app' }}
        run: |
          ./android/gradlew \
            -p android \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

          test -f android/app/build/outputs/apk/debug/app-debug.apk

          ls -lh android/app/build/outputs/apk/debug/

      # 15. Build Release APK
      - name: Build Release APK
        env:
          ZONI_BACKEND_URL: ${{ vars.ZONI_BACKEND_URL || 'https://zoni-ai-675435111499.asia-southeast1.run.app' }}
        run: |
          ./android/gradlew \
            -p android \
            --no-daemon \
            :app:assembleRelease \
            --stacktrace

          test -d android/app/build/outputs/apk/release/

          ls -lh android/app/build/outputs/apk/release/

      # 16. Optional Release APK signing
      - name: Sign Release APK
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          RELEASE_DIR="android/app/build/outputs/apk/release"

          KEY_B64="${ANDROID_KEY_BASE64:-${ANDROID_KEYSTORE_BASE64:-}}"
          KS_PASS="${ANDROID_KEYSTORE_PASSWORD:-}"
          KEY_PASS="${ANDROID_KEY_PASSWORD:-}"
          KEY_ALIAS="${ANDROID_KEY_ALIAS:-}"

          if [[ -z "$KEY_B64" || -z "$KS_PASS" || -z "$KEY_PASS" || -z "$KEY_ALIAS" ]]; then
            echo "Signing secrets are not configured."
            echo "Gradle-generated Release APK will be uploaded as-is."
            exit 0
          fi

          UNSIGNED_APK="$RELEASE_DIR/app-release-unsigned.apk"

          if [[ ! -f "$UNSIGNED_APK" ]]; then
            echo "Unsigned Release APK not found."
            echo "Available release files:"
            ls -la "$RELEASE_DIR"
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/zoni-release.jks"
          ALIGNED_APK="$RELEASE_DIR/app-release-aligned.apk"

          trap 'rm -f "$KEYSTORE" "$ALIGNED_APK"' EXIT

          printf '%s' "$KEY_B64" | base64 --decode > "$KEYSTORE"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            "$UNSIGNED_APK" \
            "$ALIGNED_APK"

          export ZONI_KS_PASS="$KS_PASS"
          export ZONI_KEY_PASS="$KEY_PASS"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:ZONI_KS_PASS \
            --key-pass env:ZONI_KEY_PASS \
            --out "$RELEASE_DIR/ZONI-AI-release.apk" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify \
            "$RELEASE_DIR/ZONI-AI-release.apk"

          echo "Release APK signing verified."

      # 17. Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZONI-AI-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # 18. Upload Release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZONI-AI-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
