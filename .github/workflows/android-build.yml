name: ZONI AI Android APK Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Build ZONI AI APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install Gradle 8.7
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 5. Build Debug APK
      - name: Build Debug APK
        run: gradle -p android :app:assembleDebug

      # 6. Build Release APK
      - name: Build Release APK
        run: gradle -p android :app:assembleRelease

      # 7. Sign Release APK (only if signing secrets exist)
      - name: Sign Release APK
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e

          RELEASE_DIR="android/app/build/outputs/apk/release"
          UNSIGNED_APK="$RELEASE_DIR/app-release-unsigned.apk"

          if [ -z "$ANDROID_KEY_BASE64" ] || \
             [ -z "$ANDROID_KEY_PASSWORD" ] || \
             [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "Signing secrets are not configured."
            echo "Unsigned release APK will be uploaded."
            exit 0
          fi

          echo "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/zoni-release.jks"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "Release APK not found: $UNSIGNED_APK"
            exit 1
          fi

          "$BUILD_TOOLS/zipalign" -v -p 4 \
            "$UNSIGNED_APK" \
            "$RELEASE_DIR/app-release-aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/zoni-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEY_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RELEASE_DIR/ZONI-AI-release.apk" \
            "$RELEASE_DIR/app-release-aligned.apk"

          "$BUILD_TOOLS/apksigner" verify \
            "$RELEASE_DIR/ZONI-AI-release.apk"

          rm -f "$RUNNER_TEMP/zoni-release.jks"

          echo "Release APK signed successfully."

      # 8. Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZONI-AI-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # 9. Upload Release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZONI-AI-Release-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
