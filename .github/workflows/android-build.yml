
name: ZONI AI Android APK Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zoni-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Test and Build ZONI AI
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm test

      - name: Run Frontend Lint
        run: npm run lint

      - name: Build Dashboard and Sync Android Assets
        env:
          VITE_BACKEND_URL: ${{ vars.ZONI_BACKEND_URL || 'https://zoni-ai-675435111499.asia-southeast1.run.app' }}
        run: npm run android:sync

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # FIX: Use Android SDK setup v4.
      # Do not install the obsolete SDK package named "tools".
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Build Environment
        run: |
          chmod +x android/gradlew
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version
          sdkmanager --version
          ./android/gradlew -p android --version

      - name: Verify Android Configuration
        run: |
          test -f android/gradle.properties
          grep -q "android.useAndroidX=true" android/gradle.properties

      - name: Run Android Unit Tests
        env:
          ZONI_BACKEND_URL: ${{ vars.ZONI_BACKEND_URL || 'https://zoni-ai-675435111499.asia-southeast1.run.app' }}
        run: |
          ./android/gradlew -p android \
            --no-daemon \
            :app:testDebugUnitTest \
            --stacktrace

      - name: Build Debug APK
        env:
          ZONI_BACKEND_URL: ${{ vars.ZONI_BACKEND_URL || 'https://zoni-ai-675435111499.asia-southeast1.run.app' }}
        run: |
          ./android/gradlew -p android \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/

      - name: Build Release APK
        env:
          ZONI_BACKEND_URL: ${{ vars.ZONI_BACKEND_URL || 'https://zoni-ai-675435111499.asia-southeast1.run.app' }}
        run: |
          ./android/gradlew -p android \
            --no-daemon \
            :app:assembleRelease \
            --stacktrace

          test -d android/app/build/outputs/apk/release/
          ls -lh android/app/build/outputs/apk/release/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZONI-AI-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZONI-AI-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
