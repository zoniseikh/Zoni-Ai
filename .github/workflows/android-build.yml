
name: ZONI AI Android APK Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Build ZONI AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      # 1. Checkout Original Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js 20
      # npm cache disabled because package-lock.json is absent
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install Frontend Dependencies
      - name: Install Frontend Dependencies & Sync Original Dashboard into Android Assets
        run: |
          node --version
          npm --version

          npm install --no-audit --no-fund

          npm test
          npm run lint
          npm run android:sync

      # 4. Setup JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # 6. Setup Gradle Cache
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      # 7. Verify Build Environment
      - name: Verify Build Environment & Gradle Wrapper
        run: |
          chmod +x android/gradlew

          echo "Checking Android SDK..."
          echo "ANDROID_HOME=$ANDROID_HOME"

          test -f android/gradle.properties

          grep -q "android.useAndroidX=true" android/gradle.properties

          echo "Checking Java..."
          java -version

          echo "Checking Gradle..."
          ./android/gradlew -p android --version

      # 8. Run Android Unit Tests
      - name: Run Android Unit Tests
        run: |
          ./android/gradlew \
            -p android \
            --no-daemon \
            :app:testDebugUnitTest \
            --stacktrace

      # 9. Build Debug APK
      - name: Build Debug APK
        run: |
          ./android/gradlew \
            -p android \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

          test -f android/app/build/outputs/apk/debug/app-debug.apk

          ls -lh android/app/build/outputs/apk/debug/

      # 10. Build Release APK
      - name: Build Release APK
        run: |
          ./android/gradlew \
            -p android \
            --no-daemon \
            :app:assembleRelease \
            --stacktrace

          ls -lh android/app/build/outputs/apk/release/

      # 11. Sign Release APK (Optional)
      - name: Sign Release APK
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

        run: |
          set -euo pipefail

          RELEASE_DIR="android/app/build/outputs/apk/release"
          UNSIGNED_APK="$RELEASE_DIR/app-release-unsigned.apk"

          KEY_B64="${ANDROID_KEY_BASE64:-${ANDROID_KEYSTORE_BASE64:-}}"
          KS_PASS="${ANDROID_KEYSTORE_PASSWORD:-${ANDROID_KEY_PASSWORD:-}}"
          KEY_PASS="${ANDROID_KEY_PASSWORD:-${ANDROID_KEYSTORE_PASSWORD:-}}"
          KEY_ALIAS="${ANDROID_KEY_ALIAS:-}"

          if [ -z "$KEY_B64" ] || \
             [ -z "$KS_PASS" ] || \
             [ -z "$KEY_PASS" ] || \
             [ -z "$KEY_ALIAS" ]; then

            echo "Signing secrets not configured."
            echo "Keeping unsigned Release APK."
            exit 0
          fi

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "ERROR: Unsigned APK not found."
            ls -la "$RELEASE_DIR"
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/zoni-release.jks"

          trap 'rm -f "$KEYSTORE" "$RELEASE_DIR/app-release-aligned.apk"' EXIT

          printf '%s' "$KEY_B64" | base64 --decode > "$KEYSTORE"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            "$UNSIGNED_APK" \
            "$RELEASE_DIR/app-release-aligned.apk"

          export ZONI_KS_PASS="$KS_PASS"
          export ZONI_KEY_PASS="$KEY_PASS"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:ZONI_KS_PASS \
            --key-pass env:ZONI_KEY_PASS \
            --out "$RELEASE_DIR/ZONI-AI-release.apk" \
            "$RELEASE_DIR/app-release-aligned.apk"

          "$BUILD_TOOLS/apksigner" verify \
            "$RELEASE_DIR/ZONI-AI-release.apk"

          echo "Release APK signed successfully."

      # 12. Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZONI-AI-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # 13. Upload Release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZONI-AI-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
