
name: ZONI AI Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zoni-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and Build ZONI AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm test

      - name: Run Frontend Lint
        run: npm run lint

      - name: Run Frontend Build
        run: npm run build

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Build Environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          sdkmanager --version

      - name: Android Unit Tests
        run: bash android/gradlew -p android --no-daemon :app:testDebugUnitTest

      - name: Build Debug APK
        run: bash android/gradlew -p android --no-daemon :app:assembleDebug

      - name: Build Release APK
        run: bash android/gradlew -p android --no-daemon :app:assembleRelease

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZONI-AI-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZONI-AI-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
