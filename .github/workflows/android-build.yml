
name: ZONI AI Android APK Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zoni-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Test and Build ZONI AI
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout original project
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 3. Install frontend dependencies
      - name: Install Frontend Dependencies
        run: npm ci

      # 4. Frontend unit tests
      - name: Run Frontend Tests
        run: npm test

      # 5. Frontend lint
      - name: Run Frontend Lint
        run: npm run lint

      # 6. Build and sync React dashboard
      - name: Build Dashboard and Sync Android Assets
        env:
          VITE_BACKEND_URL: ${{ vars.ZONI_BACKEND_URL || 'https://zoni-ai-675435111499.asia-southeast1.run.app' }}
        run: npm run android:sync

      # 7. Setup Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 8. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # 9. Setup Gradle cache
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 10. Verify build environment
      - name: Verify Build Environment
        run: |
          chmod +x android/gradlew
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version
          sdkmanager --version
          ./android/gradlew -p android --version

      # 11. Verify Android configuration
      - name: Verify Android Configuration
        run: |
          test -f android/gradle.properties
          grep -q "android.useAndroidX=true" android/gradle.properties

      # 12. Run Android Unit Tests
      - name: Run Android Unit Tests
        env:
          ZONI_BACKEND_URL: ${{ vars.ZONI_BACKEND_URL || 'https://zoni-ai-675435111499.asia-southeast1.run.app' }}
        run: |
          ./android/gradlew \
            -p android \
            --no-daemon \
            :app:testDebugUnitTest \
            --stacktrace

      # 13. Upload test reports even when tests fail
      - name: Upload Android Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZONI-AI-Android-Test-Reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      # 14. Build Debug APK
      - name: Build Debug APK
        env:
          ZONI_BACKEND_URL: ${{ vars.ZONI_BACKEND_URL || 'https://zoni-ai-675435111499.asia-southeast1.run.app' }}
        run: |
          ./android/gradlew \
            -p android \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/

      # 15. Build Release APK
      - name: Build Release APK
        env:
          ZONI_BACKEND_URL: ${{ vars.ZONI_BACKEND_URL || 'https://zoni-ai-675435111499.asia-southeast1.run.app' }}
        run: |
          ./android/gradlew \
            -p android \
            --no-daemon \
            :app:assembleRelease \
            --stacktrace

          test -d android/app/build/outputs/apk/release/
          ls -lh android/app/build/outputs/apk/release/

      # 16. Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZONI-AI-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # 17. Upload Release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZONI-AI-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # 18. Build summary
      - name: Build Summary
        if: always()
        run: |
          echo "## ZONI AI Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend tests: see workflow steps" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android unit tests: see test report artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- Debug and Release APK: check artifact upload steps" >> "$GITHUB_STEP_SUMMARY"
