name: ZONI AI Android APK Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Build ZONI AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout source
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js 22 + npm cache (reproducible builds via committed package-lock.json)
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Unit Tests & TypeScript Check
        run: |
          npm test
          npm run lint

      - name: Build React Dashboard & Sync into Android Assets
        run: npm run android:sync

      # 3. Java 17 (compatible with AGP 8.5.2 & Gradle 8.7)
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # 5. Configure Gradle cache (uses project's own android/gradlew wrapper)
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      # 6. Verify Android SDK, Java 17, AndroidX & Gradle Wrapper
      - name: Verify Build Environment & Gradle Wrapper
        run: |
          chmod +x android/gradlew
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f android/gradle.properties
          grep -q "android.useAndroidX=true" android/gradle.properties
          java -version
          ./android/gradlew -p android --version

      # 7. Run Android Unit Tests (always enabled — prints JUnit failure details on error)
      - name: Run Android Unit Tests
        run: |
          set +e
          ./android/gradlew -p android --no-daemon :app:testDebugUnitTest --stacktrace
          TEST_EXIT=$?
          if [ "$TEST_EXIT" -ne 0 ]; then
            echo "=== Android Unit Test Failure Summary ==="
            for xml in android/app/build/test-results/testDebugUnitTest/*.xml; do
              if [ -f "$xml" ] && grep -q "<failure" "$xml"; then
                echo "--- $xml ---"
                cat "$xml"
              fi
            done
          fi
          exit "$TEST_EXIT"

      - name: Upload Android Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZONI-AI-Android-Unit-Test-Reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      # 8. Build & Validate Debug APK (never requires signing secrets)
      - name: Build Debug APK
        run: |
          ./android/gradlew -p android --no-daemon :app:assembleDebug --stacktrace
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$DEBUG_APK"
          ls -lh "$DEBUG_APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$DEBUG_APK" | head -n 5

      # 9. Build & Validate Release APK
      - name: Build Release APK
        run: |
          ./android/gradlew -p android --no-daemon :app:assembleRelease --stacktrace
          ls -lh android/app/build/outputs/apk/release/
          RELEASE_APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          test -s "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$RELEASE_APK" | head -n 5

      # 10. Sign Release APK only when valid signing secrets are configured (no secrets in if:)
      - name: Sign Release APK (if signing secrets are configured)
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          RELEASE_DIR="android/app/build/outputs/apk/release"
          UNSIGNED_APK="$RELEASE_DIR/app-release-unsigned.apk"
          KEY_B64="${ANDROID_KEY_BASE64:-${ANDROID_KEYSTORE_BASE64:-}}"
          KS_PASS="${ANDROID_KEYSTORE_PASSWORD:-${ANDROID_KEY_PASSWORD:-}}"
          KEY_PASS="${ANDROID_KEY_PASSWORD:-${ANDROID_KEYSTORE_PASSWORD:-}}"
          KEY_ALIAS="${ANDROID_KEY_ALIAS:-}"

          if [ -z "$KEY_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "Signing secrets not configured; keeping unsigned Release APK."
            {
              echo "### ZONI AI APK Build Summary"
              echo "- **Debug APK**: Built and validated (\`app-debug.apk\`, installable directly on Android devices)"
              echo "- **Release APK**: Built **UNSIGNED** (\`app-release-unsigned.apk\`) because repository signing secrets are not configured."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "Unsigned APK not found at $UNSIGNED_APK"
            ls -la "$RELEASE_DIR" || true
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/zoni-release.jks"
          trap 'rm -f "$KEYSTORE" "$RELEASE_DIR/app-release-aligned.apk"' EXIT

          printf '%s' "$KEY_B64" | base64 --decode > "$KEYSTORE"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            "$UNSIGNED_APK" \
            "$RELEASE_DIR/app-release-aligned.apk"

          export ZONI_KS_PASS="$KS_PASS"
          export ZONI_KEY_PASS="$KEY_PASS"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:ZONI_KS_PASS \
            --key-pass env:ZONI_KEY_PASS \
            --out "$RELEASE_DIR/ZONI-AI-release.apk" \
            "$RELEASE_DIR/app-release-aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --print-certs "$RELEASE_DIR/ZONI-AI-release.apk"

          {
            echo "### ZONI AI APK Build Summary"
            echo "- **Debug APK**: Built and validated (\`app-debug.apk\`)"
            echo "- **Release APK**: Built, **SIGNED**, and verified with \`apksigner\` (\`ZONI-AI-release.apk\`)"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Release APK signed and verified successfully."

      # 11. Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZONI-AI-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # 12. Upload Release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZONI-AI-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
