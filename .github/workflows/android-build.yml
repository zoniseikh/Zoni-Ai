name: Build Zoni AI Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Original Zoni AI Dashboard + Native Android APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Install Node.js dependencies
        run: npm ci || npm install

      - name: 4. Run frontend, Bengali number, voice command & backend API tests
        run: npm test

      - name: 5. TypeScript lint validation
        run: npm run lint

      - name: 6. Build original Zoni AI React dashboard & sync into Android assets
        run: npm run android:sync

      - name: 7. Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 8. Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: 9. Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 10. Run Android unit tests (JUnit)
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace

      - name: 11. Run Android Gradle validation & Lint
        working-directory: android
        run: gradle lintDebug --stacktrace

      - name: 12. Build real installable Debug APK (no signing credentials required)
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: 13. Verify Debug APK output exists
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: 14. Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoni-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 15. Decode release keystore (only when GitHub Secrets are configured)
        id: decode_keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          echo "keystore_ready=true" >> "$GITHUB_OUTPUT"

      - name: 16. Build Signed Release APK & Play Store AAB (when signing secrets are configured)
        if: ${{ steps.decode_keystore.outputs.keystore_ready == 'true' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/bundle/release/app-release.aab

      - name: 17. Upload Signed Release APK artifact
        if: ${{ steps.decode_keystore.outputs.keystore_ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: zoni-ai-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: 18. Upload Signed Release AAB artifact
        if: ${{ steps.decode_keystore.outputs.keystore_ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: zoni-ai-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: 19. Clean up decoded keystore file
        if: always()
        run: rm -f android/app/release-keystore.jks
