name: ZONI AI Android APK Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Build ZONI AI APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK - fixed configuration
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # 4. Gradle 8.7
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 5. Verify Android SDK
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed
          java -version
          gradle --version

      # 6. Build Debug APK
      - name: Build Debug APK
        run: gradle -p android --no-daemon :app:assembleDebug

      # 7. Build Release APK
      - name: Build Release APK
        run: gradle -p android --no-daemon :app:assembleRelease

      # 8. Sign Release APK if secrets are configured
      - name: Sign Release APK
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          RELEASE_DIR="android/app/build/outputs/apk/release"
          UNSIGNED_APK="$RELEASE_DIR/app-release-unsigned.apk"

          if [ -z "$ANDROID_KEY_BASE64" ] || \
             [ -z "$ANDROID_KEY_PASSWORD" ] || \
             [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "Signing secrets missing."
            echo "Unsigned Release APK will be uploaded."
            exit 0
          fi

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "Unsigned APK not found: $UNSIGNED_APK"
            ls -la "$RELEASE_DIR" || true
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/zoni-release.jks"

          echo "$ANDROID_KEY_BASE64" | base64 --decode > "$KEYSTORE"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/zipalign" -v -p 4 \
            "$UNSIGNED_APK" \
            "$RELEASE_DIR/app-release-aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEY_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RELEASE_DIR/ZONI-AI-release.apk" \
            "$RELEASE_DIR/app-release-aligned.apk"

          "$BUILD_TOOLS/apksigner" verify \
            "$RELEASE_DIR/ZONI-AI-release.apk"

          rm -f "$KEYSTORE"

          echo "Release APK signed successfully."

      # 9. Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZONI-AI-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # 10. Upload Release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZONI-AI-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
