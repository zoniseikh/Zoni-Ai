# Project-wide Gradle settings for Zoni AI Android (com.zoni.jarvis.assistant)

# JVM memory & encoding tuned for Kotlin 2.0 + KSP + Compose + R8 builds
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Required for all AndroidX dependencies (Compose, Core-Telecom, Room, DataStore, WebKit, Security Crypto)
android.useAndroidX=true

# Jetifier is disabled because Zoni AI has zero legacy android.support dependencies
android.enableJetifier=false

# Official Kotlin code style & modern Android Gradle Plugin defaults
kotlin.code.style=official
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
